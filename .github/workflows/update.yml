name: update-vendored-sources

on:
  schedule:
    # AEST = UTC+10 year-round.
    - cron: "17 20 * * *" # 06:17 AEST
    - cron: "17 3 * * *"  # 13:17 AEST
  workflow_dispatch:

concurrency:
  group: update-vendored-sources
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test update safeguards and check baseline
        run: |
          python3 -m unittest discover -s .github/tests -v
          python3 .github/source-guard.py
      - name: Resolve candidate sources
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          umask 077
          printf '[keys]\ngithub = "%s"\n' "$GH_TOKEN" > "$RUNNER_TEMP/keys.toml"
          trap 'rm -f "$RUNNER_TEMP/keys.toml"' EXIT
          nix run .#update-sources -- --keep-going --keyfile "$RUNNER_TEMP/keys.toml"
      - name: Restore incomplete or inconsistent package groups
        run: python3 .github/source-guard.py --restore
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-sources
          path: _sources/
          if-no-files-found: error

  validate:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: candidate-sources
          path: _sources/
      - name: Build and smoke-test every supported package
        run: python3 .github/validate-packages.py '${{ matrix.system }}' --report 'reports/${{ matrix.system }}.json'
      - uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.system }}
          path: reports/
          if-no-files-found: error

  commit:
    needs: [prepare, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: candidate-sources
          path: _sources/
      - uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: reports/
          merge-multiple: true
      - name: Keep only updates passing every native platform
        run: |
          python3 .github/source-guard.py --reports reports
          nix flake check --all-systems --no-build
      - name: Commit validated bumps
        run: |
          git add -- _sources/generated.nix _sources/generated.json _sources/update-status.json
          if git diff --cached --quiet; then
            echo "No validated source changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(sources): update vendored packages to latest upstream"
          # A concurrent change must reject this push; do not rebase untested sources.
          git push origin HEAD:"${GITHUB_REF_NAME}"
